[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-platform-reliability-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "requests>=2.32,<3", "azure-storage-blob>=12.24,<13", "azure-identity>=1.19,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[project.scripts]
reliability-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'I', 'UP']
